name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD,MYSQL_ROOT_PASSWORD,DB_NAME,DB_USER,DB_PASSWORD
          script: |
            set -e
            echo "Starting deployment..."
            if [ ! -d ~/github-actions-kubernetes-masterclass ]; then
              echo "Cloning repository..."
              git clone ${{ github.server_url }}/${{ github.repository }}.git ~/github-actions-kubernetes-masterclass
            fi
            cd ~/github-actions-kubernetes-masterclass
            echo "Pulling latest code..."
            git pull origin main
            echo "Creating .env file..."
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" > .env
            echo "DOCKERHUB_PASSWORD=$DOCKERHUB_PASSWORD" >> .env
            echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" >> .env
            echo "MYSQL_DATABASE=$DB_NAME" >> .env
            echo "MYSQL_USER=$DB_USER" >> .env
            echo "MYSQL_PASSWORD=$DB_PASSWORD" >> .env
            echo "Docker images before pull:"
            docker images
            echo "Pulling Docker images..."
            docker compose pull || echo "Warning: docker compose pull failed"
            echo "Docker images after pull:"
            docker images
            echo "Starting containers..."
            docker compose up -d
            echo "Checking running containers..."
            docker ps
            echo "Deployment completed successfully!"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
